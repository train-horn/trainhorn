[package]
name = "trainhorn-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.65"
description = "Command-line calculators for train horn setups: dB at distance, tank runtime, compressor refill, AWG wire size."
authors = ["Train Horn <trainhornsmaster@gmail.com>"]
license = "MIT"
homepage = "https://train-horn.com/"
repository = "https://github.com/train-horn/trainhorn"
publish = false

[[bin]]
name = "trainhorn"
path = "src/main.rs"

[dependencies]
trainhorn = { path = "..", version = "1.0.0" }
